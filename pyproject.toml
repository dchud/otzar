[project]
name = "otzar"
version = "0.1.0"
description = "A library catalog for small collections, using python/django"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.89.0",
    "django>=6.0.3",
    "django-extensions>=4.1",
    "django-tailwind-cli>=4.5.1",
    "gunicorn>=25.3.0",
    "httpx>=0.28.1",
    # 0.9.2 fixes denial-of-service advisories in the MARCXML reader,
    # which is the path every SRU response takes.
    "mrrc>=0.9.2",
    "pillow>=12.2.0",
    "pycountry>=26.2.16",
    "pyopenssl>=26.0.0",
    "python-dotenv>=1.2.2",
    "qrcode>=8.2",
    "werkzeug>=3.1.8",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=6.3.0",
    "pytest>=9.0.2",
    "pytest-django>=4.12.0",
    "pytest-playwright>=0.7.2",
    "pytest-socket>=0.7.0",
    "ruff>=0.15.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "otzar.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
pythonpath = ["."]
# tmp/ is where CLAUDE.md sends all scratch, and .claude holds agent
# worktrees -- checkouts of this repo whose tests are another branch's.
# Collecting either turns a throwaway file into a suite failure.
norecursedirs = ["tmp", ".claude", ".venv", "node_modules"]

[tool.ruff]
line-length = 79
target-version = "py313"
# Agent worktrees are checkouts of this same repo nested inside it.
# Linting them means linting another branch's in-progress code.
extend-exclude = [".claude"]

[tool.ruff.lint]
# Ruff's implicit default rule set varies between releases, so leaving it
# unnamed makes the lint gate a property of whichever ruff resolved
# rather than of this project, and turns a linter upgrade into an
# unrelated code change. These are the rules the gate enforces:
# pycodestyle errors, Pyflakes, and import sorting.
#
# isort (I) is deliberate rather than inherited: the tree was already
# almost entirely sorted, so enforcing it ratifies existing practice,
# and a canonical import order makes the merge conflicts that parallel
# work produces in shared modules resolve mechanically.
select = ["E4", "E7", "E9", "F", "I"]
