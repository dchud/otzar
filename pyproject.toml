[project]
name = "otzar"
version = "0.1.0"
description = "A library catalog for small collections, using python/django"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Capped: the OCR path is the one place a dependency can break
    # silently. Its tests mock the client, so a major release that
    # renamed a parameter would pass CI and fail only against the
    # real API. The cap turns that into a resolver error at upgrade
    # time. tests/test_ocr_contract.py checks the surface directly;
    # once it has proven itself the cap can come off.
    "anthropic>=1.3.0,<2",
    "django>=6.0.3",
    "django-extensions>=4.1",
    "django-tailwind-cli>=4.5.1",
    "gunicorn>=25.3.0",
    "httpx>=0.28.1",
    # 0.9.2 fixes denial-of-service advisories in the MARCXML reader,
    # which is the path every SRU response takes.
    "mrrc>=0.9.2",
    "pillow>=12.2.0",
    "pycountry>=26.2.16",
    "pyopenssl>=26.0.0",
    "python-dotenv>=1.2.2",
    "qrcode>=8.2",
    "werkzeug>=3.1.8",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=6.3.0",
    "mkdocs-material>=9.6.0",
    "pytest>=9.0.2",
    "pytest-django>=4.12.0",
    "pytest-playwright>=0.7.2",
    "pytest-socket>=0.7.0",
    "ruff>=0.15.9",
    "zizmor>=1.30.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "otzar.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
pythonpath = ["."]
# tmp/ is where CLAUDE.md sends all scratch, and .claude holds agent
# worktrees -- checkouts of this repo whose tests are another branch's.
# Collecting either turns a throwaway file into a suite failure.
norecursedirs = ["tmp", ".claude", ".venv", "node_modules"]
# The suite exercises three remote services -- the Anthropic API for
# OCR, the SRU catalogs at NLI, LC and DNB, and Open Library for covers
# -- and every test of those paths mocks the client. Blocking sockets
# turns that convention into enforcement, so a test that forgets a patch
# or patches the wrong name fails instead of quietly making a real call.
# Unix sockets stay open for the database and the live-server fixture.
addopts = ["--disable-socket", "--allow-unix-socket"]

[tool.ruff]
line-length = 79
target-version = "py313"
# Agent worktrees are checkouts of this same repo nested inside it.
# Linting them means linting another branch's in-progress code.
#
# studies/ holds the scripts that produced published findings, kept
# byte-for-byte as they ran. Reformatting them would mean the committed
# code is no longer the code the numbers came from, which is the one
# property that makes them worth keeping. They are not imported by the
# application and are not on any runtime path.
extend-exclude = [".claude", "studies"]

[tool.ruff.lint]
# Ruff's default rule set is the gate, plus the pycodestyle families its
# default omits. The default is curated per rule rather than by linter --
# it takes E722 and E902 from pycodestyle and leaves the rest -- so E4
# (import placement), E7 (statement style) and E9 (syntax) are named here
# to keep checks the project already enforced. Pyflakes and isort (I001)
# are in the default and need no restating.
#
# The set is a property of the resolved ruff, and uv.lock pins that
# exactly, so it changes only when a dependency PR moves the lock and
# shows the new findings.
extend-select = ["E4", "E7", "E9"]

[tool.ruff.lint.per-file-ignores]
# Django writes migrations; makemigrations regenerates them and would
# strip any annotation added by hand.
"*/migrations/*.py" = ["RUF012"]
