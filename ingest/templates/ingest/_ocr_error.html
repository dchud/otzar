<div class="border-2 border-red-300 dark:border-red-700 rounded p-4 space-y-3 bg-red-50/30 dark:bg-red-900/10"
     role="alert">
  <p class="text-sm text-red-700 dark:text-red-300">
    OCR could not extract metadata from this image. Try again, or discard
    the photo and take a sharper one.
  </p>
  <button type="button"
          hx-post="{% url 'run_ocr' scan.id %}"
          hx-target="#title-page-metadata"
          hx-swap="innerHTML"
          hx-disabled-elt="this"
          hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
          class="inline-flex items-center justify-center text-sm px-3 py-2 min-h-[44px] border border-gray-300 dark:border-gray-600 rounded hover:bg-gray-50 dark:hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed">
    <span class="btn-idle">Try OCR again</span>
    <span class="btn-busy items-center gap-2">
      <svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" aria-hidden="true"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
      Reading...
    </span>
  </button>
</div>
