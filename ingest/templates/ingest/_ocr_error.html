<div class="border-2 border-red-300 dark:border-red-700 rounded p-4 space-y-3 bg-red-50/30 dark:bg-red-900/10"
     role="alert">
  <p class="text-sm text-red-700 dark:text-red-300">
    OCR could not extract metadata from this image. Try again, or discard
    the photo and take a sharper one.
  </p>
  <button type="button"
          hx-post="{% url 'run_ocr' scan.id %}"
          hx-target="#title-page-metadata"
          hx-swap="innerHTML"
          hx-indicator="#ocr-spinner"
          hx-disabled-elt="this"
          hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
          class="text-sm px-3 py-2 min-h-[44px] border border-gray-300 dark:border-gray-600 rounded hover:bg-gray-50 dark:hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed">
    Try OCR again
  </button>
</div>
