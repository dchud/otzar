name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# `static/css/tailwind.css` is generated from the templates rather than
# committed, so both test jobs build it before they run anything. The
# unit suite asserts the stylesheet URL carries a cache-busting stamp,
# which reads the file from disk; the browser suite renders real pages,
# and without the stylesheet most of it passes against an unstyled
# application, which looks like coverage and is not.
#
# `lint`, `test` and `test-e2e` are required status checks on `main`. A
# required check that never reports is not treated as passing: it sits
# pending and the pull request cannot merge. So a workflow-level or
# job-level `paths-ignore` is not available here. Instead every job
# always runs and always reports, and `test` and `test-e2e` decide
# inside the job whether the changed files can reach any code the suites
# exercise. `lint` has no such gate -- it is the cheap job, and its
# process-label check reads the Markdown that the test gate ignores.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check for process labels in persistent artifacts
        run: uv run python scripts/lint_process_labels.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether the change can affect tests
        id: relevant
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          run_tests() {
            echo "$1 Running the tests."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ -z "$BASE_SHA" ] ||
             [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            run_tests "No base commit to compare against."
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            run_tests "Base commit ${BASE_SHA} is not in this checkout."
          fi
          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          if [ -z "$changed" ]; then
            run_tests "Git reported no changed files."
          fi
          echo "Changed files:"
          echo "$changed" | sed 's/^/  /'
          while IFS= read -r file; do
            case "$file" in
              .beads/*|*.md) ;;
              *) run_tests "${file} can affect application behaviour." ;;
            esac
          done <<< "$changed"
          echo "Only tracker and Markdown files changed. Skipping the tests."
          echo "run=false" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v4
        if: steps.relevant.outputs.run == 'true'
        with:
          enable-cache: true

      - name: Set up Python 3.13
        if: steps.relevant.outputs.run == 'true'
        run: uv python install 3.13

      - name: Install dependencies
        if: steps.relevant.outputs.run == 'true'
        run: uv sync

      - name: Create .env file
        if: steps.relevant.outputs.run == 'true'
        run: |
          cat <<'EOF' > .env
          SECRET_KEY=ci-test-secret-key-not-for-production
          DEBUG=true
          ALLOWED_HOSTS=localhost,127.0.0.1
          CSRF_TRUSTED_ORIGINS=
          DATA_DIR=
          ANTHROPIC_API_KEY=
          CLAUDE_MODEL=claude-haiku-4-5
          SRU_REQUEST_DELAY=0
          RECORD_ID_PREFIX=otzar-
          SITE_PASSWORD=
          EOF

      - name: Cache the Tailwind CLI
        if: steps.relevant.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: .django_tailwind_cli
          key: tailwind-cli-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            tailwind-cli-${{ runner.os }}-

      - name: Build the stylesheet
        if: steps.relevant.outputs.run == 'true'
        run: uv run python manage.py tailwind build --force

      - name: Run unit tests
        if: steps.relevant.outputs.run == 'true'
        run: uv run pytest --ignore=tests/e2e

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether the change can affect tests
        id: relevant
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          run_tests() {
            echo "$1 Running the tests."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ -z "$BASE_SHA" ] ||
             [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            run_tests "No base commit to compare against."
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            run_tests "Base commit ${BASE_SHA} is not in this checkout."
          fi
          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          if [ -z "$changed" ]; then
            run_tests "Git reported no changed files."
          fi
          echo "Changed files:"
          echo "$changed" | sed 's/^/  /'
          while IFS= read -r file; do
            case "$file" in
              .beads/*|*.md) ;;
              *) run_tests "${file} can affect application behaviour." ;;
            esac
          done <<< "$changed"
          echo "Only tracker and Markdown files changed. Skipping the tests."
          echo "run=false" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v4
        if: steps.relevant.outputs.run == 'true'
        with:
          enable-cache: true

      - name: Set up Python 3.13
        if: steps.relevant.outputs.run == 'true'
        run: uv python install 3.13

      - name: Install dependencies
        if: steps.relevant.outputs.run == 'true'
        run: uv sync

      - name: Create .env file
        if: steps.relevant.outputs.run == 'true'
        run: |
          cat <<'EOF' > .env
          SECRET_KEY=ci-test-secret-key-not-for-production
          DEBUG=true
          ALLOWED_HOSTS=localhost,127.0.0.1
          CSRF_TRUSTED_ORIGINS=
          DATA_DIR=
          ANTHROPIC_API_KEY=
          CLAUDE_MODEL=claude-haiku-4-5
          SRU_REQUEST_DELAY=0
          RECORD_ID_PREFIX=otzar-
          SITE_PASSWORD=
          EOF

      - name: Cache the Tailwind CLI
        if: steps.relevant.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: .django_tailwind_cli
          key: tailwind-cli-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            tailwind-cli-${{ runner.os }}-

      - name: Build the stylesheet
        if: steps.relevant.outputs.run == 'true'
        run: uv run python manage.py tailwind build --force

      - name: Cache Playwright browsers
        if: steps.relevant.outputs.run == 'true'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.relevant.outputs.run == 'true'
        run: uv run playwright install chromium --with-deps

      - name: Run e2e tests
        if: steps.relevant.outputs.run == 'true'
        run: uv run pytest tests/e2e/
